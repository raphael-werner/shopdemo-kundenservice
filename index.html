<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopDemo Kundenservice</title>

  <script defer src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css">
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f8f7f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid #e8e5e1;
      background: #f8f7f5;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a90a4;
    }

    header span {
      font-size: 0.9rem;
      font-weight: 500;
      color: #333;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>

  <header>
    <div class="dot"></div>
    <span>ShopDemo Kundenservice</span>
  </header>

  <script>
    window.addEventListener("chat-messenger-loaded", () => {
      chatSdk.registerContext(
        chatSdk.prebuilts.ces.createContext({
          deploymentName: "projects/446864674375/locations/us/apps/59f895ab-1d2c-483d-9247-e5543e7cf86c/deployments/74631868-6be8-4bc4-b071-cfb98cb80599",
          tokenBroker: {
            enableTokenBroker: true,
            enableRecaptcha: false
          },
          enableWelcomeEvent: true
        }),
      );

      // Auto-open the chat widget
      setTimeout(() => {
        const cm = document.querySelector("chat-messenger");
        if (cm) {
          cm.removeAttribute("minimized");
          cm.setAttribute("open", "true");
        }
      }, 800);
    });
  </script>

  <chat-messenger url-allowlist="*" open>
    <chat-messenger-container
      chat-title="ShopDemo Kundenservice"
      chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
      enable-file-upload
    >
      <chat-reset-session-button slot="titlebar-actions" title-text="Start new chat"></chat-reset-session-button>
      <chat-toggle-dialog-button slot="titlebar-actions" title-text-expanded="Collapse" title-text-collapsed="Expand"></chat-toggle-dialog-button>
      <chat-messenger-close-button slot="titlebar-actions" title-text="Close"></chat-messenger-close-button>
    </chat-messenger-container>
  </chat-messenger>

</body>
</html>
